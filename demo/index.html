<!DOCTYPE html>
<html lang="en-us" data-orda-layout="viewport-16x9-contain">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Orda Web</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        position: fixed;
        inset: 0;
      }

      #orda-stage {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        overflow: hidden;
        background: #231F20;
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #231F20;
      }

      #unity-loading-bar {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #d9e8ff;
        background: #000;
        font: 600 14px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      #unity-progress-track {
        width: min(320px, 52vw);
        height: 5px;
        overflow: hidden;
        border: 1px solid #446a9a;
        background: #07101d;
      }

      #unity-progress-bar-full {
        width: 0;
        height: 100%;
        background: #6ca8ea;
        transition: width 100ms linear;
      }

      #orda-start {
        min-width: 180px;
        padding: 12px 18px;
        border: 1px solid #7196c5;
        border-radius: 2px;
        color: #edf5ff;
        background: #101a28;
        font: 700 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        cursor: pointer;
      }

      #orda-start:hover,
      #orda-start:focus-visible {
        color: #fff;
        border-color: #a8cfff;
        background: #17283d;
      }

      #unity-warning {
        position: absolute;
        z-index: 2;
        top: 0;
        left: 0;
        right: 0;
        display: none;
        text-align: center;
        font: 14px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #orda-controls {
        position: fixed;
        z-index: 3;
        right: 8px;
        bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .orda-control {
        padding: 5px 8px;
        border: 1px solid #48566a;
        border-radius: 2px;
        color: #b9c4d3;
        background: rgba(5, 8, 12, 0.72);
        font: 600 10px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.08em;
        opacity: 0.58;
        cursor: pointer;
      }

      .orda-control:hover,
      .orda-control:focus-visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <main id="orda-stage" data-orda-layout="viewport-16x9-contain">
      <canvas
        id="unity-canvas"
        width=1280
        height=720
        tabindex="-1"
        aria-label="Orda Web"></canvas>
      <div id="unity-loading-bar" aria-live="polite">
        <div id="unity-loading-label">Loading Orda</div>
        <div id="unity-progress-track">
          <div id="unity-progress-bar-full"></div>
        </div>
        <button id="orda-start" type="button" hidden>Start Orda</button>
      </div>
      <div id="unity-warning"></div>
    </main>
    <div id="orda-controls" role="group" aria-label="Game display controls">
      <button
        class="orda-control"
        id="orda-fullscreen"
        type="button"
        aria-pressed="false"
        title="Play Orda fullscreen">FULL SCREEN</button>
      <button
        class="orda-control"
        id="orda-save-diagnostics"
        type="button"
        title="Download the last three browser diagnostic sessions">SAVE LOG</button>
    </div>

    <script>
      const ORDA_ASPECT = 16 / 9;
      const stage = document.querySelector("#orda-stage");
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const loadingLabel = document.querySelector("#unity-loading-label");
      const progressTrack = document.querySelector("#unity-progress-track");
      const progressBar = document.querySelector("#unity-progress-bar-full");
      const startButton = document.querySelector("#orda-start");
      const fullscreenButton = document.querySelector("#orda-fullscreen");
      const saveDiagnosticsButton = document.querySelector("#orda-save-diagnostics");
      let ordaUnityInstance = null;

      const ORDA_DIAGNOSTICS_STORAGE_KEY = "orda-browser-diagnostics-v1";
      const ORDA_DIAGNOSTICS_MAX_SESSIONS = 3;
      const ORDA_DIAGNOSTICS_MAX_ENTRIES = 2000;
      const ORDA_DIAGNOSTICS_MAX_LIFE_CHANGES = 500;
      // These records intentionally retain full scoring and rejection evidence,
      // so keep a smaller rolling window than ordinary console messages.
      const ORDA_DIAGNOSTICS_MAX_AI_DECISIONS = 50;
      const ORDA_LIFE_TRACE_PREFIX = "[ORDA_LIFE_TRACE]";
      const ORDA_AI_DECISION_TRACE_PREFIX = "[ORDA_AI_DECISION_TRACE] ";
      // AI traces may include hidden board knowledge. This strict browser opt-in
      // is paired with Unity's independent WebGL + non-network runtime gate.
      const browserAiDecisionTraceRequested =
        new URLSearchParams(window.location.search).get("aiTrace") === "1";
      const diagnosticCapturePolicy = {
        authoritativeLifeChanges: true,
        speculativeAiLifeChanges: false,
        aiDecisionTraceRequested: browserAiDecisionTraceRequested,
        aiDecisionTraceScope: "local-vs-ai-only",
        hostedMultiplayerPrivateState: false,
      };
      const nativeConsole = {
        log: console.log.bind(console),
        warn: console.warn.bind(console),
        error: console.error.bind(console),
      };
      const diagnosticSession = {
        id: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8),
        startedAt: new Date().toISOString(),
        url: window.location.href,
        userAgent: navigator.userAgent,
        entries: [],
        lifeChanges: [],
        lifeChangesDropped: 0,
        aiDecisions: [],
        aiDecisionsDropped: 0,
        capturePolicy: diagnosticCapturePolicy,
      };
      let previousDiagnosticSessions = [];
      let diagnosticsPersistTimer = 0;
      let nextDiagnosticEntrySequence = 1;
      let nextLifeChangeCaptureSequence = 1;
      let nextAiDecisionCaptureSequence = 1;

      try {
        const storedDiagnostics = JSON.parse(
          window.localStorage.getItem(ORDA_DIAGNOSTICS_STORAGE_KEY) || "{}");
        if (Array.isArray(storedDiagnostics.sessions)) {
          previousDiagnosticSessions = storedDiagnostics.sessions.slice(
            0,
            ORDA_DIAGNOSTICS_MAX_SESSIONS - 1);
        }
      } catch (_) {
        previousDiagnosticSessions = [];
      }

      function diagnosticArgumentText(value) {
        if (typeof value === "string") return value;
        if (value instanceof Error) return value.stack || value.message || String(value);
        try {
          return JSON.stringify(value);
        } catch (_) {
          return String(value);
        }
      }

      function persistOrdaDiagnostics() {
        diagnosticsPersistTimer = 0;
        try {
          window.localStorage.setItem(
            ORDA_DIAGNOSTICS_STORAGE_KEY,
            JSON.stringify({
              version: 3,
              capturePolicy: diagnosticCapturePolicy,
              sessions: [diagnosticSession, ...previousDiagnosticSessions].slice(
                0,
                ORDA_DIAGNOSTICS_MAX_SESSIONS),
            }));
        } catch (_) {
          // The console remains the fallback diagnostic surface when storage is unavailable.
        }
      }

      function scheduleDiagnosticsPersist() {
        if (diagnosticsPersistTimer) return;
        diagnosticsPersistTimer = window.setTimeout(persistOrdaDiagnostics, 250);
      }

      function recordLifeChange(message, consoleEntrySequence) {
        const prefixIndex = message.indexOf(ORDA_LIFE_TRACE_PREFIX);
        if (prefixIndex < 0) return false;
        const jsonStart = message.indexOf("{", prefixIndex + ORDA_LIFE_TRACE_PREFIX.length);
        if (jsonStart < 0) return false;

        try {
          const payload = JSON.parse(message.slice(jsonStart));
          diagnosticSession.lifeChanges.push({
            captureSequence: nextLifeChangeCaptureSequence++,
            browserCapturedUtc: new Date().toISOString(),
            consoleEntrySequence,
            ...payload,
          });
          if (diagnosticSession.lifeChanges.length > ORDA_DIAGNOSTICS_MAX_LIFE_CHANGES) {
            diagnosticSession.lifeChanges.splice(
              0,
              diagnosticSession.lifeChanges.length - ORDA_DIAGNOSTICS_MAX_LIFE_CHANGES);
            diagnosticSession.lifeChangesDropped += 1;
          }
          return true;
        } catch (_) {
          // Keep the raw console entry below if a future payload cannot be parsed.
          return false;
        }
      }

      function recordAiDecision(message, consoleEntrySequence) {
        if (!browserAiDecisionTraceRequested ||
            !message.startsWith(ORDA_AI_DECISION_TRACE_PREFIX)) {
          return false;
        }

        try {
          const payload = JSON.parse(message.slice(ORDA_AI_DECISION_TRACE_PREFIX.length));
          if (!payload || typeof payload !== "object" || Array.isArray(payload)) {
            return false;
          }

          diagnosticSession.aiDecisions.push({
            ...payload,
            captureSequence: nextAiDecisionCaptureSequence++,
            browserCapturedUtc: new Date().toISOString(),
            consoleEntrySequence,
          });
          if (diagnosticSession.aiDecisions.length > ORDA_DIAGNOSTICS_MAX_AI_DECISIONS) {
            const dropCount =
              diagnosticSession.aiDecisions.length - ORDA_DIAGNOSTICS_MAX_AI_DECISIONS;
            diagnosticSession.aiDecisions.splice(0, dropCount);
            diagnosticSession.aiDecisionsDropped += dropCount;
          }
          return true;
        } catch (_) {
          // Keep the raw console entry below if a future payload cannot be parsed.
          return false;
        }
      }

      function recordConsoleEntry(level, args) {
        const sequence = nextDiagnosticEntrySequence++;
        const message = Array.from(args).map(diagnosticArgumentText).join(" ");
        const structuredLifeChangeCaptured = recordLifeChange(message, sequence);
        const structuredAiDecisionCaptured = recordAiDecision(message, sequence);
        const unrequestedAiDecision =
          !browserAiDecisionTraceRequested &&
          message.startsWith(ORDA_AI_DECISION_TRACE_PREFIX);
        diagnosticSession.entries.push({
          sequence,
          utc: new Date().toISOString(),
          performanceMs: Math.round(performance.now()),
          level,
          message: structuredLifeChangeCaptured
            ? ORDA_LIFE_TRACE_PREFIX + " stored in session.lifeChanges"
            : structuredAiDecisionCaptured
              ? ORDA_AI_DECISION_TRACE_PREFIX + "stored in session.aiDecisions"
              : unrequestedAiDecision
                ? ORDA_AI_DECISION_TRACE_PREFIX + "ignored; aiTrace opt-in is disabled"
                : message.slice(0, 6000),
        });
        if (diagnosticSession.entries.length > ORDA_DIAGNOSTICS_MAX_ENTRIES) {
          diagnosticSession.entries.splice(
            0,
            diagnosticSession.entries.length - ORDA_DIAGNOSTICS_MAX_ENTRIES);
        }
        scheduleDiagnosticsPersist();
      }

      console.log = (...args) => {
        recordConsoleEntry("log", args);
        nativeConsole.log(...args);
      };
      console.warn = (...args) => {
        recordConsoleEntry("warning", args);
        nativeConsole.warn(...args);
      };
      console.error = (...args) => {
        recordConsoleEntry("error", args);
        nativeConsole.error(...args);
      };

      function buildDiagnosticExport() {
        persistOrdaDiagnostics();
        return {
          exportedAt: new Date().toISOString(),
          version: 3,
          capturePolicy: diagnosticCapturePolicy,
          sessions: [diagnosticSession, ...previousDiagnosticSessions].slice(
            0,
            ORDA_DIAGNOSTICS_MAX_SESSIONS),
        };
      }

      window.ordaDownloadDiagnostics = function () {
        const blob = new Blob(
          [JSON.stringify(buildDiagnosticExport(), null, 2)],
          { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "orda-browser-diagnostics-" +
          new Date().toISOString().replace(/[:.]/g, "-") + ".json";
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      };
      saveDiagnosticsButton.addEventListener("click", window.ordaDownloadDiagnostics);
      window.addEventListener("pagehide", persistOrdaDiagnostics);

      function logBrowserInput(phase, event, extra = {}, level = "log") {
        const payload = {
          source: "browser",
          session: diagnosticSession.id,
          utc: new Date().toISOString(),
          performanceMs: Math.round(performance.now()),
          phase,
          pointerId: event && Number.isFinite(event.pointerId) ? event.pointerId : null,
          pointerType: event && event.pointerType ? event.pointerType : null,
          button: event && Number.isFinite(event.button) ? event.button : null,
          clientX: event && Number.isFinite(event.clientX) ? Math.round(event.clientX) : null,
          clientY: event && Number.isFinite(event.clientY) ? Math.round(event.clientY) : null,
          ...extra,
        };
        console[level]("[ORDA_INPUT_TRACE] " + JSON.stringify(payload));
      }

      const activeCanvasPointers = new Map();
      canvas.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        activeCanvasPointers.set(event.pointerId, {
          startedAt: performance.now(),
          clientX: event.clientX,
          clientY: event.clientY,
          pointerType: event.pointerType,
        });
        logBrowserInput("browser_pointer_down", event, {
          activePointerCount: activeCanvasPointers.size,
        });
      }, true);

      window.addEventListener("pointerup", (event) => {
        const active = activeCanvasPointers.get(event.pointerId);
        if (!active) return;
        activeCanvasPointers.delete(event.pointerId);
        const path = typeof event.composedPath === "function" ? event.composedPath() : [];
        const releasedOverCanvas = path.includes(canvas);
        const distance = Math.hypot(
          event.clientX - active.clientX,
          event.clientY - active.clientY);
        logBrowserInput("browser_pointer_up", event, {
          durationMs: Math.round(performance.now() - active.startedAt),
          distancePixels: Math.round(distance),
          releasedOverCanvas,
          activePointerCount: activeCanvasPointers.size,
        }, releasedOverCanvas ? "log" : "warn");
        if (!releasedOverCanvas) {
          unityShowBanner(
            "INPUT INTERRUPTED: the pointer was released outside the game. Try the action again.",
            "warning");
        }
      }, true);

      window.addEventListener("pointercancel", (event) => {
        const active = activeCanvasPointers.get(event.pointerId);
        if (!active) return;
        activeCanvasPointers.delete(event.pointerId);
        logBrowserInput("browser_pointer_cancel", event, {
          durationMs: Math.round(performance.now() - active.startedAt),
          activePointerCount: activeCanvasPointers.size,
        }, "warn");
        unityShowBanner(
          "INPUT INTERRUPTED: the browser cancelled the hold. Try the action again.",
          "warning");
      }, true);

      canvas.addEventListener("lostpointercapture", (event) => {
        if (!activeCanvasPointers.has(event.pointerId)) return;
        logBrowserInput("browser_pointer_capture_lost", event, {}, "warn");
      }, true);

      function interruptActiveCanvasPointers(reason) {
        if (!activeCanvasPointers.size) return;
        const interruptedPointerIds = Array.from(activeCanvasPointers.keys());
        activeCanvasPointers.clear();
        logBrowserInput("browser_pointer_interrupted", null, {
          reason,
          interruptedPointerIds,
        }, "warn");
        unityShowBanner(
          "INPUT INTERRUPTED: the game lost focus during a hold. Try the action again.",
          "warning");
      }

      window.addEventListener("blur", () => interruptActiveCanvasPointers("window-blur"));
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible") {
          interruptActiveCanvasPointers("document-hidden");
        }
      });

      window.addEventListener("error", (event) => {
        console.error("[ORDA_RUNTIME_TRACE] " + JSON.stringify({
          phase: "window_error",
          message: event.message || "unknown error",
          filename: event.filename || "",
          line: event.lineno || 0,
          column: event.colno || 0,
        }));
      });
      window.addEventListener("unhandledrejection", (event) => {
        console.error("[ORDA_RUNTIME_TRACE] " + JSON.stringify({
          phase: "unhandled_rejection",
          reason: diagnosticArgumentText(event.reason),
        }));
      });

      console.log(
        "[ORDA_RUNTIME_TRACE] browser diagnostics session started id=" +
        diagnosticSession.id +
        " aiDecisionTraceRequested=" + browserAiDecisionTraceRequested +
        " aiDecisionTraceScope=local-vs-ai-only");

      function fitOrdaViewport() {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        let stageWidth;
        let stageHeight;

        if (viewportWidth / viewportHeight >= ORDA_ASPECT) {
          stageHeight = viewportHeight;
          stageWidth = viewportHeight * ORDA_ASPECT;
        } else {
          stageWidth = viewportWidth;
          stageHeight = viewportWidth / ORDA_ASPECT;
        }

        stage.style.width = stageWidth + "px";
        stage.style.height = stageHeight + "px";
      }

      fitOrdaViewport();
      window.addEventListener("resize", fitOrdaViewport);
      window.addEventListener("orientationchange", fitOrdaViewport);

      function syncFullscreenButton() {
        const isFullscreen = Boolean(document.fullscreenElement);
        fullscreenButton.textContent = isFullscreen ? "EXIT FULL SCREEN" : "FULL SCREEN";
        fullscreenButton.setAttribute("aria-pressed", String(isFullscreen));
        fullscreenButton.title = isFullscreen ? "Exit fullscreen" : "Play Orda fullscreen";
      }

      async function toggleOrdaFullscreen() {
        try {
          if (document.fullscreenElement) {
            await document.exitFullscreen();
          } else if (document.documentElement.requestFullscreen) {
            await document.documentElement.requestFullscreen({ navigationUI: "hide" });
          } else if (ordaUnityInstance && typeof ordaUnityInstance.SetFullscreen === "function") {
            ordaUnityInstance.SetFullscreen(1);
          } else {
            throw new Error("Fullscreen API unavailable");
          }
        } catch (error) {
          console.warn("[ORDA_RUNTIME_TRACE] fullscreen request failed: " +
            diagnosticArgumentText(error));
          unityShowBanner("Fullscreen is not available in this browser.", "warning");
        }
      }

      fullscreenButton.addEventListener("click", toggleOrdaFullscreen);
      document.addEventListener("fullscreenchange", () => {
        syncFullscreenButton();
        fitOrdaViewport();
        console.log("[ORDA_RUNTIME_TRACE] fullscreen=" + Boolean(document.fullscreenElement));
      });
      syncFullscreenButton();

      function startOrdaWithSound() {
        if (!ordaUnityInstance)
        {
          return;
        }

        try {
          ordaUnityInstance.SendMessage(
            "TitleCardStage",
            "RetryIntroAfterBrowserAudioUnlock");
          console.log("[ORDA_AUDIO_TRACE] browser start gesture sent to title audio");
        } catch (error) {
          console.warn("[ORDA_AUDIO_TRACE] title audio start message failed: " +
            diagnosticArgumentText(error));
        }

        loadingBar.style.display = "none";
        canvas.focus({ preventScroll: true });
      }

      startButton.addEventListener("click", startOrdaWithSound);

      function unityShowBanner(message, type) {
        const warningBanner = document.querySelector("#unity-warning");
        const item = document.createElement("div");
        item.textContent = message;
        item.style.padding = "10px";
        item.style.background = type === "error" ? "#7b1515" : "#8a6500";
        warningBanner.appendChild(item);
        warningBanner.style.display = "block";

        if (type !== "error") {
          window.setTimeout(() => {
            item.remove();
            warningBanner.style.display = warningBanner.children.length ? "block" : "none";
          }, 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/0e9cfb3eacabcaf64bcb0118cef9e3df.loader.js";
      const config = {
        arguments: browserAiDecisionTraceRequested
          ? ["--orda-browser-ai-trace"]
          : [],
        dataUrl: buildUrl + "/1426c65694a6ba59740f0ae6b464beef.data.unityweb",
        frameworkUrl: buildUrl + "/7cc4b7d54cc8bdfe190bfcf36159e4dc.framework.js.unityweb",
        codeUrl: buildUrl + "/1a4d82812a7c0ed4843fb708e13dcb9d.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Orda Web",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };


      const loaderScript = document.createElement("script");
      loaderScript.src = loaderUrl;
      loaderScript.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBar.style.width = 100 * progress + "%";
        }).then((instance) => {
          ordaUnityInstance = instance;
          progressBar.style.width = "100%";
          progressTrack.style.display = "none";
          loadingLabel.textContent = "Click to begin with sound";
          startButton.hidden = false;
          startButton.focus({ preventScroll: true });
          console.log("[ORDA_AUDIO_TRACE] browser audio start gate ready");
        }).catch((message) => {
          unityShowBanner(String(message), "error");
        });
      };
      loaderScript.onerror = () => {
        unityShowBanner("The Orda loader could not be downloaded.", "error");
      };
      document.body.appendChild(loaderScript);
    </script>
  </body>
</html>
